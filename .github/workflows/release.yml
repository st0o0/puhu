name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --- NuGet: Plugin SDK ---
  nuget-build:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    env:
      PACKAGE_OUTPUT: ./packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./src/global.json

      - name: Restore
        run: dotnet restore ./src/Servus.TUI.slnx

      - name: Build
        run: >
          dotnet build ./src/Servus.TUI.slnx
          -c Release
          --no-restore
          /p:Version=${{ needs.release-please.outputs.version }}
          /p:ContinuousIntegrationBuild=true

      - name: Pack SDK
        run: >
          dotnet pack ./src/Servus.Plugin.Sdk/Servus.Plugin.Sdk.csproj
          -c Release
          --no-build
          --output ${{ env.PACKAGE_OUTPUT }}
          /p:PackageVersion=${{ needs.release-please.outputs.version }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg

  nuget-publish:
    runs-on: ubuntu-latest
    needs: [release-please, nuget-build]
    environment: nuget

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Install .NET
        uses: actions/setup-dotnet@v4

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./packages/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_SECRET }}
          --skip-duplicate

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: ./packages/*.nupkg

  # --- Executables: cross-platform Runner ---
  publish-executables:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: servus-tui-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: servus-tui-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: servus-tui-osx-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./src/global.json

      - name: Publish
        run: >
          dotnet publish src/Servus.TUI/Servus.TUI.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.release-please.outputs.version }}
          -p:AssemblyVersion=${{ needs.release-please.outputs.version }}
          -p:FileVersion=${{ needs.release-please.outputs.version }}
          -p:InformationalVersion=${{ needs.release-please.outputs.version }}
          -o publish/${{ matrix.artifact }}

      - name: Archive (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C publish ${{ matrix.artifact }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.artifact }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
